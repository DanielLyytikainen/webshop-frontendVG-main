<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link rel="stylesheet" href="../css/bootstrap.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="icon" href="../images/favicon.ico" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">The Webshop</a>

        <div class="position-relative d-lg-none">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <span
            id="cart-count-mobile"
            class="badge bg-danger position-absolute top-0 start-100 translate-middle"
          >
            0
          </span>
        </div>

        <div class="collapse navbar-collapse" id="navbarNav">
          <div class="ms-auto d-flex align-items-center gap-2">
            <a class="btn btn-outline-light" href="products.html">Products</a>
            <a class="btn btn-outline-light" href="index.html">Home</a>

            <button
              onclick="toggleCart()"
              class="btn btn-outline-light position-relative"
            >
              <i class="bi bi-bag-fill"></i>
              <span
                id="cart-count"
                class="badge bg-danger position-absolute top-0 start-100 translate-middle"
              >
                0
              </span>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <header class="text-center mt-4">
      <img src="../images/logo.png" class="img-fluid logo-custom mb-4" />
      <h1>Our products</h1>
    </header>

    <main class="flex-grow-1">
      <div id="products"></div>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-auto">
      <div class="container">
        <p class="mb-0">© 2026 The Webshop av Daniel L, Igor G, Patric W</p>
      </div>
    </footer>

    <script src="../js/bootstrap.bundle.js"></script>
    <script src="../js/shoppingcart.js"></script>
    <script src="../js/products.js"></script>

    <div id="overlay" onclick="toggleCart()"></div>
    <div id="cart-drawer" class="cart-drawer">
      <h3>🛒 Shopping Cart</h3>
      <ul id="cart-items"></ul>
      <p id="cart-total"></p>
      <div class="cart-buttons">
        <button onclick="goToOrder()" class="btn btn-success">Order</button>
        <button onclick="clearCart()" class="btn btn-outline-dark">
          Clear
        </button>
        <button onclick="toggleCart()" class="btn btn-outline-dark">
          Close
        </button>
      </div>
    </div>
  </body>
</html>
