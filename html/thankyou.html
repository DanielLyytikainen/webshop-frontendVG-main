<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank you!</title>
    <link rel="stylesheet" href="../css/bootstrap.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" href="../images/favicon.ico" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">The Webshop</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <div class="ms-auto">
            <a class="btn btn-outline-light me-2" href="products.html"
              >Products</a
            >
            <a class="btn btn-outline-light" href="index.html">Home</a>
          </div>
        </div>
      </div>
    </nav>

    <header class="text-center mt-4">
      <img
        id="logo2"
        src="../images/thankyouforshopping.png"
        alt="logo"
        class="img-fluid logo-custom mb-4"
      />
      <h1>Thank you for your purchase!</h1>
    </header>

    <main class="text-center mt-4 flex-grow-1">
      <p>Your order has been submitted.</p>
      <p>
        A confirmation email will be sent to your registered email address
        within 15 minutes.
      </p>
      <div class="container mt-4">
        <ul id="thank-items" class="list-group"></ul>
        <p id="thank-total" class="mt-3"></p>
      </div>

      <button id="back-btn" class="btn btn-primary mt-3">← Back to shop</button>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-auto">
      <div class="container">
        <p class="mb-0">© 2026 The Webshop av Daniel L, Igor G, Patric W</p>
      </div>
    </footer>

    <script src="../js/bootstrap.bundle.js"></script>
    <script src="../js/thankyou.js"></script>
  </body>
</html>
